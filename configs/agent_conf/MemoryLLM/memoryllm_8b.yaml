# MemoryLLM-8B (Wang et al., 2024) as a MemoryAgentBench baseline.
#
# The agent name must contain the lowercase substring "memoryllm": AgentWrapper
# routes on substring matches, and "rag" must not appear in it or the RAG branch
# would claim the call first.
#
# No retrieve_num: MemoryLLM answers from its memory pool, with no retriever.
# No agent_chunk_size either -- ConversationCreator asserts that key is only set
# for mem0/letta/cognee/zep. Chunk length is controlled with
# --chunk_size_ablation, which writes dataset_config['chunk_size'].
agent_name: memoryllm_agent

# model_path is the downloaded checkpoint. dtype float16 because the weights
# ship as float32 (39.1 GB) and a V100 has 32 GB; bf16 is not hardware-accelerated
# on sm_70. See methods/memoryllm.py.
model_path: /share/latent/MemoryLLM-8B
dtype: float16
device: cuda:0

# MemoryLLM was trained at max_length 512 and truncates to it. Any chunk longer
# than this loses its tail, so run with --chunk_size_ablation 512.
inject_max_tokens: 512
max_new_tokens: 32

# Read by AgentWrapper.__init__; unused by the MemoryLLM handler because the pool
# replaces the sliding context window. Kept in the same shape as other configs.
model: memoryllm-8b
temperature: 0.0
input_length_limit: 10000000
buffer_length: 200
output_dir: ./outputs/memoryllm-8b
