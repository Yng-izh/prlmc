# PRLM-C E6c / arm 2 of 3: native selection. `select_blocks`.
#
# Identical to `prlmc_e6c-evict.yaml` except `compact_mode`. When the budget is
# full the window is cut into whole 256-slot blocks, the best-scoring
# `target // block` of them are kept, and every kept slot is copied verbatim from
# the source window. No new vector is synthesised, so the reader sees only
# content it produced itself.
#
# This is the arm the trained residual has to beat. Phase 3's claim is that the
# residual improves on plain selection, and that claim is only meaningful because
# the residual *starts from the identical carriers*: `_select_block_indices` is
# shared by both operators.
agent_name: prlmc_agent

model_path: /share/latent/MemoryLLM-8B
dtype: float16
device: cuda:0

inject_max_tokens: 512
max_new_tokens: 32

model: prlmc-8b
temperature: 0.0
input_length_limit: 10000000
buffer_length: 200
output_dir: ./outputs/prlmc-e6c-select

ablation_mode: OURS
structural_ablation: trigger_occupancy_only

prlmc:
  # --- slot layout -------------------------------------------------------
  k_anchor: 512
  # 50% of the 12288-slot nominal working capacity; see the eviction arm.
  k_max: 6144
  anchor_source: first_chunk

  # --- residual writing --------------------------------------------------
  write_mode: append
  gate_mode: ones
  address_threshold: 0.85

  # --- projection --------------------------------------------------------
  projection: none

  # --- novelty -----------------------------------------------------------
  novelty_ema_beta: 0.9
  basis_max_rank: 256
  basis_energy: 0.95

  # --- capacity trigger --------------------------------------------------
  tau_k: 0.80
  tau_n: 0.50
  tau_k_exit: 0.0
  tau_n_exit: 0.30
  trigger_consecutive: 1
  trigger: occupancy
  rank_eta: 0.95
  rank_max: 256

  # --- compaction: native block selection --------------------------------
  compact_mode: select_blocks
  compact_ratio: 0.5
  compact_period: 10
  # 19 blocks. `compact_with_report` builds its window as
  # `min(used - protect, max(compact_min_slots, used // 2))`, so a floor of
  # 4864 makes every capacity-trigger compaction exactly 19 -> 9 blocks -- the
  # same geometry the checkpoint was trained on. The 256 default would have made
  # the benchmark compact a 10-block window instead, i.e. evaluate the trained
  # operator at half the width it was trained at.
  compact_min_slots: 4864
  select_weights:
    importance: 0.4
    recency: 0.3
    goal: 0.2
    diversity: 0.1
  # Unread by this arm but present in the training run's config, so the shipped
  # value is the one training actually used (`--gamma-max 0.05` overrides the
  # 0.1 YAML default on the training path).
  carrier_rank: 32
  carrier_gamma_max: 0.05

  compact_probe: false
  active_memory_mask: true
  native_filler_only: true

  # --- importance weights (section 3.4) ---------------------------------
  importance_weights:
    goal: 1.0
    reuse: 0.5
    recency: 0.5
    confidence: 0.5
    surprise: 0.5
    emphasis: 1.0

  # --- runtime -----------------------------------------------------------
  stats_dir: ./outputs/prlmc-e6c-select
  verbose: true
