# PRLM-C Round 1: occupancy-only structural ablation.
#
# Purpose is narrow. This run answers exactly three questions and nothing else:
#   1. does occupancy >= 0.80 actually fire the trigger;
#   2. does `used` actually drop after a compaction;
#   3. how much MemoryAgentBench accuracy does compaction cost.
#
# Novelty is removed from the *decision* entirely: `trigger: occupancy` forces
# `above_n = True` inside CompactTrigger.observe, so `tau_n` is never read. The
# novelty *gate* stays at its OURS default, because that is an amplitude on the
# written block rather than a compaction decision, and Round 1 is meant to
# exercise the real OURS write path. `write_mode` also stays `append`: the
# low-novelty update-in-place path is Round 2's subject and must not be
# confounded with the trigger question.
#
# Why occupancy-only and not occupancy_novelty: the smoke run showed novelty EMA
# >= 0.885 holds only through write 24 while occupancy >= 0.80 begins at write
# 38. The two qualifying windows are disjoint by 14 writes, so no value of
# `trigger_consecutive` can make the conjunction fire. Testing the trigger
# further is pointless until the compactor itself is shown to work under a
# trigger that does fire.
agent_name: prlmc_agent

model_path: /share/latent/MemoryLLM-8B
dtype: float16
device: cuda:0

inject_max_tokens: 512
max_new_tokens: 32

model: prlmc-8b
temperature: 0.0
input_length_limit: 10000000
buffer_length: 200
output_dir: ./outputs/prlmc-b

ablation_mode: OURS
# Section 5.3 one-mechanism probe. The explicit keys below restate it, and
# `build_config` applies the structural overrides before the explicit ones, so
# the two can never disagree silently.
structural_ablation: trigger_occupancy_only

prlmc:
  # --- slot layout -------------------------------------------------------
  k_anchor: 512
  anchor_source: first_chunk

  # --- residual writing --------------------------------------------------
  # `append` on purpose: Round 1 isolates the trigger and the compactor.
  write_mode: append
  gate_mode: novelty
  address_threshold: 0.85

  # --- projection --------------------------------------------------------
  projection: none

  # --- novelty -----------------------------------------------------------
  novelty_ema_beta: 0.9
  basis_max_rank: 256
  basis_energy: 0.95

  # --- capacity trigger (the subject of Round 1) -------------------------
  # tau_k 0.80 = 9830 slots of the 12288-slot working capacity. The pool is
  # filled by chunk 48, so the condition first becomes true there and stays true
  # on every subsequent write; occupancy is a binary "is the pool full" signal
  # after the first fill, not a graded one.
  #
  # trigger_consecutive 1 removes the consecutive-run requirement. With the
  # threshold at 0.80 and the exit threshold at 0.0, a run of length 1 means
  # "compact on the first write at or above 0.80 occupancy", which is the most
  # permissive setting that still routes through the threshold branch rather
  # than the over-budget branch.
  #
  # tau_n and tau_n_exit are present only because PRLMCConfig validates them;
  # `trigger: occupancy` never reads either on the decision path.
  tau_k: 0.80
  tau_n: 0.50
  tau_k_exit: 0.0
  tau_n_exit: 0.30
  trigger_consecutive: 1
  trigger: occupancy
  rank_eta: 0.95
  # Reporting-only. With `trigger: occupancy` the spectrum is not computed at
  # all (`_observe_capacity` gates it on `occupancy_novelty_rank`), so both rank
  # fields read 0 in this run. That is expected, not a failure.
  rank_max: 256

  # --- compaction --------------------------------------------------------
  compact_mode: none
  compact_ratio: 0.5
  compact_period: 10
  compact_min_slots: 256
  # Inert in the benchmark path: register_probes has no call site, so
  # `agent.prlmc_probes` is never created and section 3.4's probe-guided
  # compaction is not exercised. Kept false so the flag cannot mislead.
  compact_probe: false

  # --- importance weights (section 3.4) ---------------------------------
  importance_weights:
    goal: 1.0
    reuse: 0.5
    recency: 0.5
    confidence: 0.5
    surprise: 0.5
    emphasis: 1.0

  # --- runtime -----------------------------------------------------------
  stats_dir: ./outputs/prlmc-b
  verbose: true
