# Opt-in configuration for the residual-subspace implementation.
# It is intentionally separate from prlmc_8b.yaml; legacy experiments keep
# their existing compactor and objective unchanged.
prlmc:
  compact_mode: carrier_residual
  basis_mode: fixed_qr
  basis_ckpt: null
  carrier_rank: 32
  carrier_gamma_max: 0.1
  functional_control: none  # none | soft | hard
  functional_lambda: 0.0
  functional_refresh: window
  functional_sketch_rank: 16
  functional_buffer_probes: 32
  projection: none
  active_memory_mask: true
  native_filler_only: true
