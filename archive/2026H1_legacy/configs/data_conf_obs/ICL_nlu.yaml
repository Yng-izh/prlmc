# Observation split: ICL nlu, one context, 333 chunks at chunk_size 400.
#
# Deliberately not one of the Tier 1 datasets. Thresholds calibrated on a split
# that also appears in the reported table would be tuned on the test set.
#
# max_test_samples is cut from 100 to 1 because this run reads the write path,
# not accuracy: every chunk is still memorized (memorization covers the whole
# context regardless of the sample cap), so the novelty/occupancy trajectory is
# complete while the query cost drops from 100 to a handful.
dataset: Test_Time_Learning
chunk_size: 4096
debug: false
seed: 42
context_max_length: 131072
sub_dataset: icl_nlu_8296shot_balance
generation_max_length: 20
test_files: ''
demo_files: ''
use_chat_template: false
max_test_samples: 1
shots: 0
stop_new_line: true
tag: null
