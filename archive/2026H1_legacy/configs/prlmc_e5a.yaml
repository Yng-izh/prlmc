# PRLM-C phase 1 / E5a: native block selection, pure-recency control.
#
# Cell A of the E4 matrix (gate=ones, compact=none) is the reference: EM 27.00.
# Cell C (gate=ones, compact=svd_tokens) is 0.00. The only difference between
# them is the compaction operator, so the operator is the sufficient cause and
# `svd_tokens` is off the main line.
#
# E5a replaces it with the most conservative operator that is still a real
# K -> K' reduction: keep the most recent whole 256-slot native blocks and copy
# them verbatim. No vector is synthesised, so the reader sees memory it was
# already trained to consume. Isolates "does the compact / write-back lifecycle
# survive at all" from "is the operator any good".
#
# Everything else is held at cell A: gate_mode ones (E4: no compression gives
# ones 27.00 vs novelty 18.00, so the gate is not the thing to fix first),
# trigger occupancy, write_mode append, projection none, k_anchor 512.
agent_name: prlmc_agent

model_path: /share/latent/MemoryLLM-8B
dtype: float16
device: cuda:0

inject_max_tokens: 512
max_new_tokens: 32

model: prlmc-8b
temperature: 0.0
input_length_limit: 10000000
buffer_length: 200
output_dir: ./outputs/prlmc-e5a

ablation_mode: OURS
# Section 5.3 one-mechanism probe. The explicit keys below restate it, and
# `build_config` applies the structural overrides before the explicit ones, so
# the two can never disagree silently.
structural_ablation: trigger_occupancy_only

prlmc:
  # --- slot layout -------------------------------------------------------
  k_anchor: 512
  anchor_source: first_chunk

  # --- residual writing --------------------------------------------------
  # `append` on purpose: Round 1 isolates the trigger and the compactor.
  write_mode: append
  gate_mode: ones
  address_threshold: 0.85

  # --- projection --------------------------------------------------------
  projection: none

  # --- novelty -----------------------------------------------------------
  novelty_ema_beta: 0.9
  basis_max_rank: 256
  basis_energy: 0.95

  # --- capacity trigger (the subject of Round 1) -------------------------
  # tau_k 0.80 = 9830 slots of the 12288-slot working capacity. The pool is
  # filled by chunk 48, so the condition first becomes true there and stays true
  # on every subsequent write; occupancy is a binary "is the pool full" signal
  # after the first fill, not a graded one.
  #
  # trigger_consecutive 1 removes the consecutive-run requirement. With the
  # threshold at 0.80 and the exit threshold at 0.0, a run of length 1 means
  # "compact on the first write at or above 0.80 occupancy", which is the most
  # permissive setting that still routes through the threshold branch rather
  # than the over-budget branch.
  #
  # tau_n and tau_n_exit are present only because PRLMCConfig validates them;
  # `trigger: occupancy` never reads either on the decision path.
  tau_k: 0.80
  tau_n: 0.50
  tau_k_exit: 0.0
  tau_n_exit: 0.30
  trigger_consecutive: 1
  trigger: occupancy
  rank_eta: 0.95
  # Reporting-only. With `trigger: occupancy` the spectrum is not computed at
  # all (`_observe_capacity` gates it on `occupancy_novelty_rank`), so both rank
  # fields read 0 in this run. That is expected, not a failure.
  rank_max: 256

  # --- compaction --------------------------------------------------------
  compact_mode: recent_blocks
  compact_ratio: 0.5
  compact_period: 10
  compact_min_slots: 256
  # Native block selection: 4864-slot window -> 2304 slots = 19 -> 9 whole
  # native blocks. `compact_ratio` 0.5 keeps the operator comparable to the
  # svd_tokens baseline it replaces, which used the same ratio.
  select_weights:
    importance: 0.4
    recency: 0.3
    goal: 0.2
    diversity: 0.1

  # Inert in the benchmark path: register_probes has no call site, so
  # `agent.prlmc_probes` is never created and section 3.4's probe-guided
  # compaction is not exercised. Kept false so the flag cannot mislead.
  compact_probe: false

  # --- importance weights (section 3.4) ---------------------------------
  importance_weights:
    goal: 1.0
    reuse: 0.5
    recency: 0.5
    confidence: 0.5
    surprise: 0.5
    emphasis: 1.0

  # --- runtime -----------------------------------------------------------
  stats_dir: ./outputs/prlmc-e5a
  verbose: true
